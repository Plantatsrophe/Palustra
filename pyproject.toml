[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "palustra"
version = "0.1.0"
description = "USACE NWPL and USDA PLANTS botanical ETL, SQLite FTS5 trigram fuzzy search, and Pydantic v2 validation service."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn>=0.28.0",
    "sqlalchemy>=2.0.0",
    "pydantic>=2.5.0",
    "openpyxl>=3.1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "httpx>=0.27.0",
]

[project.scripts]
palustra = "palustra.cli:main"

[tool.setuptools.packages.find]
include = ["palustra*"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
